- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: PG_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        idle_timeout: 180
        max_connections: 50
        retries: 1
  tables: "!include default/tables/tables.yaml"

# The inventory bounded context, exposed through the same GraphQL endpoint so the
# dashboard can read stock alongside orders. Hasura has read-only permissions
# here: every write goes through the inventory service.
- name: inventory
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: INVENTORY_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        idle_timeout: 180
        max_connections: 20
        retries: 1
  tables: "!include inventory/tables/tables.yaml"
