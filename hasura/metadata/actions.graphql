type Mutation {
  """
  Place an order. Supply idempotencyKey so that retrying after a timeout
  returns the original order instead of placing a second one.
  """
  placeOrder(items: [OrderItemInput!]!, idempotencyKey: String): OrderMutationResult

  """
  Advance an order. Supply expectedVersion to be told when another operator has
  changed the order first, instead of silently overwriting their work.
  """
  transitionOrder(
    orderId: uuid!
    action: String!
    expectedVersion: Int
    reason: String
  ): OrderMutationResult
}

input OrderItemInput {
  productId: uuid!
  quantity: Int!
}

type OrderMutationResult {
  id: uuid!
  status: String!
  """Current concurrency version, to send with the next request."""
  version: Int
}
