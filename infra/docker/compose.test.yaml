# Isolated test stack.
#
# This is an OVERRIDE applied on top of compose.yaml, so the services stay in
# one place. Everything that could collide with a running dev stack is changed
# here: published ports, the Keycloak realm, and (via .env.test) the database
# names. The Compose project name supplies an isolated network and volume, so
# `make test-reset` can never drop the dev volume.
#
#   docker compose -p orderflow-test --env-file .env.test \
#     -f infra/docker/compose.yaml -f infra/docker/compose.test.yaml ...
#
# Use the `make test-*` targets rather than typing that by hand.

services:
  postgres:
    ports:
      - "55432:5432"
    volumes:
      # Named volume is project-scoped, so this is a different disk from dev.
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  workflow-service:
    ports:
      - "13001:3001"
    environment:
      LOG_LEVEL: debug

  inventory-service:
    ports:
      - "13002:3002"
    environment:
      LOG_LEVEL: debug
      # Short TTL so reservation-expiry behaviour is observable in a demo
      # instead of requiring a five minute wait.
      RESERVATION_TTL_SECONDS: "60"

  keycloak:
    ports:
      - "18081:8080"
    volumes:
      # Mounted at the SAME target path as the dev realm so this replaces it.
      # Compose merges volume lists by target, so a different path would mount
      # both realms, and they share user UUIDs that collide on Keycloak's
      # global user primary key.
      - ../keycloak/realm-orderflow-test.json:/opt/keycloak/data/import/realm-ecommerce-orderflow.json:ro
    healthcheck:
      test:
        ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/orderflow-test HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 40

  hasura:
    ports:
      - "18080:8080"
    environment:
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"jwk_url":"http://keycloak:8080/realms/orderflow-test/protocol/openid-connect/certs",
         "claims_map":{
           "x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},
           "x-hasura-default-role":{"path":"$$.hasura_default_role"},
           "x-hasura-user-id":{"path":"$$.sub"}}}
