apiVersion: v1
kind: Service
metadata:
  name: {{ include "orderflow.name" . }}-inventory
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "orderflow.name" . }}-inventory
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orderflow.name" . }}-inventory
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.inventoryService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "orderflow.name" . }}-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "orderflow.name" . }}-inventory
    spec:
      containers:
        - name: inventory-service
          image: {{ .Values.images.inventoryService }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "orderflow.secretName" . }}, key: postgres-password }
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "orderflow.name" . }}-postgres:5432/{{ .Values.inventoryService.databaseName }}"
            {{- else }}
            # In production the inventory connection string is provisioned
            # out-of-band alongside the order one.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "orderflow.secretName" . }}, key: inventory-database-url }
            {{- end }}
            - name: ACTION_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "orderflow.secretName" . }}, key: action-secret }
            - name: PORT
              value: "3002"
            - name: RESERVATION_TTL_SECONDS
              value: {{ .Values.inventoryService.reservationTtlSeconds | quote }}
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.inventoryService.resources | nindent 12 }}
{{- if .Values.inventoryService.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orderflow.name" . }}-inventory
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "orderflow.name" . }}-inventory
  policyTypes: [Ingress]
  ingress:
    # Only the workflow service (reservations) and Hasura (event triggers) may
    # reach the inventory service. Nothing else in the cluster can touch stock.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "orderflow.name" . }}-workflow
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "orderflow.name" . }}-hasura
      ports:
        - protocol: TCP
          port: 3002
{{- end }}
